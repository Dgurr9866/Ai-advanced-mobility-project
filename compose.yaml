services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - drone-network

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - drone-network

networks:
  drone-network:
    driver: bridge
